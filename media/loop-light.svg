<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-label="The loop: you describe the job in plain words, the agent writes the .nika, nika check audits it before a token is spent, nika run stays yours to type, nika trace verify seals the receipt · the file is the repeatable part">
  <!-- The loop · same THEME contract as hero-dark.svg (the light twin swaps
       only the THEME block · scripts/media/derive-hero-light.py). -->
  <style>
    /* THEME:START */
    :root {
      --bg0: #fbfcfe; --bg1: #eef2f8;
      --ink: #0b0d12; --tag: #4a5568; --cmd: #1a2233;
      --legend: #5a6b80; --legend-dim: #5a6b80;
      --accent: #c2410c;
      --mark: #04050d; --glow: #5b8cff;
      --star: #5b8cff; --star-op: 0.5; --tw-lo: 0.1; --tw-hi: 0.55;
      --pulse-lo: 0.15; --pulse-hi: 0.38; --halo-op: 0.18;
      --chip-bg: #f0f3f9; --chip-stroke: #d8dfeb;
      --frame: #0b0d12; --frame-op: 0.1;
      --v-infer: #3b5bdb; --v-exec: #c2410c; --v-invoke: #0b7285; --v-agent: #862e9c;
      --wm-op: 0.05;
    }
    /* THEME:END */
    .mono { font-family: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .cmd { font-size: 13px; fill: var(--cmd); }
    .lbl { font-size: 10px; fill: var(--legend); letter-spacing: 0.02em; }
    .dim { font-size: 10.5px; fill: var(--legend-dim); }
    .arrow { font-size: 15px; fill: var(--legend); }
    .stars { opacity: var(--star-op); }
    .s1 { animation: twinkle 3.4s ease-in-out infinite alternate; }
    .s2 { animation: twinkle 4.8s ease-in-out 1.1s infinite alternate; }
    .h1 { animation: hi1 12s ease-in-out infinite; }
    .h2 { animation: hi2 12s ease-in-out infinite; }
    .h3 { animation: hi3 12s ease-in-out infinite; }
    .h4 { animation: hi4 12s ease-in-out infinite; }
    .h5 { animation: hi5 12s ease-in-out infinite; }
    .march { stroke-dasharray: 5 6; animation: march 1.4s linear infinite; }
    @keyframes twinkle { from { opacity: var(--tw-lo); } to { opacity: var(--tw-hi); } }
    @keyframes march { to { stroke-dashoffset: 11; } }
    @keyframes hi1 { 0% { opacity: 0; } 4% { opacity: 1; } 16% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes hi2 { 0%, 20% { opacity: 0; } 24% { opacity: 1; } 36% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes hi3 { 0%, 40% { opacity: 0; } 44% { opacity: 1; } 56% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes hi4 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 76% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes hi5 { 0%, 80% { opacity: 0; } 84% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg0)"/>
      <stop offset="1" stop-color="var(--bg1)"/>
    </linearGradient>
    <clipPath id="lframe"><rect width="1200" height="190" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#lframe)">
    <rect width="1200" height="190" fill="url(#lbg)"/>
    <g class="stars" fill="var(--star)">
      <circle class="s1" cx="120" cy="26" r="1.1"/><circle class="s2" cx="392" cy="170" r="1"/>
      <circle class="s1" cx="620" cy="20" r="1.3"/><circle class="s2" cx="905" cy="168" r="1"/>
      <circle class="s1" cx="1080" cy="30" r="1.1"/><circle class="s2" cx="1156" cy="140" r="1"/>
      <circle class="s2" cx="60" cy="150" r="1"/><circle class="s1" cx="1010" cy="24" r="1.2"/>
    </g>

    <text class="mono lbl" x="167" y="42">plain words</text>
    <rect x="167" y="54" width="181" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h1" x="167" y="54" width="181" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="185" y="80">describe the job</text>

    <text class="mono arrow" x="356" y="80">→</text>

    <text class="mono lbl" x="382" y="42">the agent writes it</text>
    <rect x="382" y="54" width="125" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h2" x="382" y="54" width="125" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="400" y="80">.nika</text>

    <text class="mono arrow" x="515" y="80">→</text>

    <text class="mono lbl" x="541" y="42">audited · zero tokens</text>
    <rect x="541" y="54" width="125" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h3" x="541" y="54" width="125" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="559" y="80">nika check</text>

    <text class="mono arrow" x="674" y="80">→</text>

    <text class="mono lbl" x="700" y="42">yours to type</text>
    <rect x="700" y="54" width="106" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h4" x="700" y="54" width="106" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="718" y="80">nika run</text>

    <text class="mono arrow" x="814" y="80">→</text>

    <text class="mono lbl" x="840" y="42">the sealed receipt</text>
    <rect x="840" y="54" width="190" height="40" rx="8" fill="var(--chip-bg)" stroke="var(--chip-stroke)"/>
    <rect class="h5" x="840" y="54" width="190" height="40" rx="8" fill="none" stroke="var(--accent)" opacity="0"/>
    <text class="mono cmd" x="858" y="80">nika trace verify</text>

    <path class="march" d="M 935 100 C 935 156, 257 156, 257 100" fill="none" stroke="var(--legend-dim)" stroke-width="1.3"/>
    <text class="mono dim" x="600" y="176" text-anchor="middle">the file is the repeatable part · run it again tomorrow</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="189" rx="12" fill="none" stroke="var(--frame)" stroke-opacity="var(--frame-op)"/>
</svg>
